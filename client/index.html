<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The page itself never zooms: a pinch on it once left a friend's whole call stuck zoomed in,
         with no way back. Shared screens and cameras zoom on their own in full screen (pinchZoom.ts). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Majlis</title>
    <meta name="description" content="Text channels, and voice channels that work like a video call." />
    <meta name="theme-color" content="#16141c" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Chooses light or dark before anything is drawn, as src/theme.ts does once the app runs. -->
    <script>
      try {
        var choice = localStorage.getItem('themeChoice');
        document.documentElement.dataset.theme = choice === 'light' || choice === 'dark' ? choice
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (error) { /* The app sets it once it runs. */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
