# Runs the same check as `npm run check` on every push and pull request, so a
# broken change is noticed even when nobody ran the check by hand.
name: Check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm --prefix client ci
      - run: npm run check
